# Everything needed to run the data room: the app, and Caddy in front of it for HTTPS.
# Start with ./install.sh, which writes .env for you.
services:
  dataroom:
    image: ghcr.io/antistud/pretty-good-dataroom:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      APP_URL: https://${DOMAIN}
    volumes:
      - data:/data
    # Not published to the internet. Only Caddy talks to it.
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - dataroom
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  # Back this volume up. It holds everything: the database and every uploaded file.
  data:
  # TLS certificates.
  caddy_data:
  caddy_config:
