name: Website

# Checks that the project website (website/ plus the markdown in docs/) builds and has no broken links.
# Publishing is done by Cloudflare, which watches the repository and runs the same build (see wrangler.jsonc).
on:
  push:
    branches: [main]
    paths: ["website/**", "docs/**", "SECURITY.md", "wrangler.jsonc", ".github/workflows/site.yml"]
  pull_request:
    paths: ["website/**", "docs/**", "SECURITY.md", "wrangler.jsonc", ".github/workflows/site.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Only the typefaces are needed from node_modules; no install scripts run.
      - run: npm ci --ignore-scripts
      - run: npm run site
