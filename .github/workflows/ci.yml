name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
        env:
          DATA_DIR: ${{ runner.temp }}/data
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm audit --audit-level=high

  image:
    # Proves the Docker image builds and the container starts and answers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dataroom-ci .
      - name: Start it and wait for the sign-in page
        run: |
          docker run -d --name dataroom-ci -p 3000:3000 -e APP_URL=http://localhost:3000 dataroom-ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/setup; then echo "up"; exit 0; fi
            sleep 2
          done
          docker logs dataroom-ci
          exit 1
      - run: bash -n install.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --redact --no-banner
